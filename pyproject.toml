[project]
name = "delta-scd-writer"
version = "0.1.0"
description = "Efficient SCD Type 1 and 2 Delta Lake writer for Databricks using PySpark."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Andrew Pensoneault", email = "apensoneault@gmail.com" }
]
dependencies = ["databricks-connect>=14.0.0", "databricks-cli==0.18.0"]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "ruff",
    "mypy",
    "pytest"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src", "tests"]
line-length = 80
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "D", "ANN"]
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
exclude = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true