[project]
name = "delta-scd-writer"
version = "0.1.0"
description = "Efficient SCD Type 1 and 2 Delta Lake writer for Databricks using PySpark."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Andrew Pensoneault", email = "apensoneault@gmail.com" }
]
dependencies = [
    "pyspark>=3.3.0",
    "delta-spark>=2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src", "tests"]
select = ["E", "F", "I", "D", "ANN"]
exclude = []
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/*.py" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true